<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RugsUSA HTML Email Projects</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
    }

    .container {
        width: 100%;
        max-width: 500px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        padding: 35px;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 2rem;
    }

    p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    ul {
        list-style: none;
    }

    li + li {
        margin-top: 12px;
    }

    a {
        display: block;
        text-decoration: none;
        color: #333;
        background: #f8f9fb;
        padding: 14px 18px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        transition: background-color .2s ease, color .2s ease, transform .2s ease;
        font-weight: 600;
    }

    a:hover {
        background: #2563eb;
        color: #fff;
        transform: translateX(5px);
    }

    a:focus-visible {
        outline: 3px solid rgba(37, 99, 235, .35);
        outline-offset: 2px;
    }
    </style>
</head>

<body>
    <div class="container">
        <h1>RugsUSA HTML Emails</h1>
        <p>A collection of responsive HTML email samples developed for RugsUSA.</p>

            <li><a href="project-6.jpg">HTML Email-6</a></li>
            <li><a href="project-7.jpg">HTML Email-7</a></li>
            <li><a href="project-8.jpg">HTML Email-8</a></li>
            <li><a href="project-9.jpg">HTML Email-9</a></li>
            <li><a href="project-10.jpg">HTML Email-10</a></li>
        </ul>
    </div>
</body>

</html>
